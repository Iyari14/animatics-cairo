[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animatics"
version = "0.1.0"
description = "Una alternativa a Manim basada en Cairo"
authors = [{name = "Iyari Neumann", email = "joseiyagironn@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pycairo>=1.20.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Iyari14/animatics-cairo"
